# =============================================================
# .github/workflows/ci.yml
# CI Pipeline: Test → Build Docker Image → Push to Docker Hub
#
# Triggers:
#   - Every push to main branch
#   - Every pull request targeting main branch
#
# Jobs:
#   1. test        : Install deps → create dummy model → run pytest
#   2. build-push  : (needs: test) → build Docker image → push to Docker Hub
# =============================================================

name: CI — Test, Build & Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ────────────────────────────────────────────────────────────
  # JOB 1: Run pytest unit tests
  # ────────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 3: Cache pip dependencies (speeds up subsequent runs)
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install PyTorch CPU (separate step — needs extra index URL)
      - name: Install PyTorch CPU
        run: |
          pip install --upgrade pip
          pip install torch==2.13.0+cpu torchvision==0.28.0+cpu \
            --extra-index-url https://download.pytorch.org/whl/cpu

      # Step 5: Install production + dev dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Step 6: Create dummy model.pt for tests
      #   (real model tracked by DVC — not in git)
      - name: Create dummy model for CI
        run: |
          python scripts/create_dummy_model.py

      # Step 7: Run all unit tests with pytest
      - name: Run pytest
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────
  # JOB 2: Build Docker image and push to Docker Hub
  #         Runs only AFTER test job passes
  # ────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ test ]   # Only runs if test job succeeds

    # Only push on pushes to main — NOT on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python to create dummy model for Docker build
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 3: Install PyTorch CPU (needed to run create_dummy_model.py)
      - name: Install PyTorch CPU
        run: |
          pip install --upgrade pip
          pip install torch==2.13.0+cpu torchvision==0.28.0+cpu \
            --extra-index-url https://download.pytorch.org/whl/cpu

      # Step 4: Create dummy model.pt so Dockerfile COPY doesn't fail
      - name: Create dummy model for Docker build
        run: |
          mkdir -p artifacts
          python scripts/create_dummy_model.py

      # Step 5: Log in to Docker Hub using repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 6: Extract metadata (tags and labels) for Docker image
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # Step 7: Build Docker image and push to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Step 8: Print image digest for traceability
      - name: Print image digest
        run: |
          echo "Docker image pushed successfully!"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
